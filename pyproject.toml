[project]
name = "kentik-device-renamer"
version = "0.1.0"
description = "Rename devices in the Kentik portal via the Device API (v202504beta2)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
# Runtime uses the Python standard library only.
dependencies = []

[project.scripts]
kentik-rename = "kentik_rename:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["kentik_rename.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
